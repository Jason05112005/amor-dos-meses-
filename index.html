<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices 2 Meses, mi Karen ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Contenedor de corazones de fondo */
        .hearts-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0.5;
        }

        @keyframes floatUp {
            to { transform: translateY(-120vh) rotate(360deg); }
        }

        /* Tarjeta principal con efecto cristal */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px 30px;
            text-align: center;
            z-index: 10;
            max-width: 90%;
            width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            animation: latido 4s infinite alternate;
        }

        @keyframes latido {
            0% { transform: scale(1); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
            100% { transform: scale(1.02); box-shadow: 0 15px 50px rgba(255, 105, 180, 0.2); }
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2em;
            color: #ff9a9e;
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .counter {
            font-size: 1.1em;
            margin-bottom: 25px;
            color: #fdfbfb;
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .media-container {
            margin: 20px 0;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .media-element {
            max-width: 100%;
            max-height: 100%;
            border-radius: 15px;
            border: 2px solid #ff9a9e;
            box-shadow: 0 0 25px rgba(255, 154, 158, 0.4);
            transition: all 0.5s ease;
            object-fit: cover;
        }

        .message-text {
            font-size: 1.25em;
            margin: 20px 0;
            font-style: italic;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            line-height: 1.4;
        }

        .next-btn {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            color: #302b63;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            transition: all 0.3s;
            margin-top: 10px;
        }

        .next-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 154, 158, 0.6);
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 25px;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .music-btn.playing {
            background: rgba(255, 154, 158, 0.4);
            border-color: #ff9a9e;
            box-shadow: 0 0 20px rgba(255, 154, 158, 0.6);
        }

        /* --- ESTILOS DEL MENSAJE SORPRESA --- */
        .surprise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .surprise-overlay.show {
            opacity: 1;
        }

        .surprise-content {
            text-align: center;
            transform: scale(0.5);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .surprise-overlay.show .surprise-content {
            transform: scale(1);
        }

        .surprise-heart {
            font-size: 100px;
            animation: pulse-heart 1s infinite alternate;
            text-shadow: 0 0 50px rgba(255,0,0,0.8);
        }

        .surprise-text {
            font-size: 4em;
            font-weight: bold;
            color: #fff;
            font-family: 'Georgia', serif;
            margin-top: 10px;
            text-shadow: 0 0 20px #ff0055, 0 0 40px #ff0055;
        }

        @keyframes pulse-heart {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* --- ESTILOS DEL RASTRO MÁGICO (PARTÍCULAS) --- */
        .trail-particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 9998;
            animation: fadeParticle 1s ease-out forwards;
        }

        @keyframes fadeParticle {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0) translateY(-20px); opacity: 0; }
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.8em; }
            .glass-card { padding: 30px 20px; }
            .media-container { height: 230px; }
            .surprise-text { font-size: 2.5em; }
            .surprise-heart { font-size: 80px; }
        }
    </style>
</head>
<body>

    <!-- Rastro de partículas mágicas -->
    <div id="trail-container"></div>
    
    <!-- Contenedor de corazones de fondo (¡ESTO FALTABA!) -->
    <div class="hearts-container" id="hearts"></div>
    
    <!-- Mensaje Sorpresa -->
    <div class="surprise-overlay" id="surpriseBox">
        <div class="surprise-content">
            <div class="surprise-heart">❤️</div>
            <div class="surprise-text">¡Te amooo!</div>
        </div>
    </div>

    <div class="glass-card">
        <h1>Felices 2 Meses, mi amor mi kiki ❤️</h1>
        
        <div class="counter" id="timeCounter">Calculando nuestro tiempo...</div>

        <div class="media-container">
            <img src="https://i.pinimg.com/originals/26/5c/f1/265cf1d1cc3255ae5f1344b085610e7f.gif" 
                 alt="Recuerdo" 
                 class="media-element" 
                 id="mainMedia">
        </div>

        <div class="message-text" id="messageText">
            "11 de junio... el mejor dia de mi vida, te amo."
        </div>

        <button class="next-btn" onclick="nextMemory()">
            Siguiente ✨🐢
        </button>
    </div>

    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>
    
    <audio id="backgroundMusic" loop style="display: none;">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- 1. LAS 11 FOTOS Y 7 GIFS (18 EN TOTAL) ---
        const memories = [
            // GIF 1
            { media: "https://i.pinimg.com/originals/26/5c/f1/265cf1d1cc3255ae5f1344b085610e7f.gif", text: "11 de junio... el mejor día de mi vida, te amo." },
            // FOTO 1
            { media: "foto-1.jpg", text: "Cada vez que te veo, me doy cuenta de lo afortunado que soy al tenerte." },
            // FOTO 2
            { media: "foto-2.jpg", text: "Tomar de tu mano cada uno de esos días me llena de felicidad, siempre quiero tenerte a mi lado." },
            // GIF 2
            { media: "https://i.pinimg.com/originals/a8/81/e2/a881e2cffe71075591c6ca8a6b86b2f9.gif", text: "Me volvió loco tu forma de ser desde el primer momento." },
            // FOTO 3
            { media: "foto-3.jpg", text: "Dos meses de ser noviecitos, la mejor dupla, el mejor equipo🐸​🐺​." },
            // FOTO 4
            { media: "foto-4.jpg", text: "Sinceramente eres la novia mas bonita del mundo mundial." },
            // GIF 3
            { media: "https://i.pinimg.com/originals/5e/d4/54/5ed4547d2a1f8d6b3670f681ea926692.gif", text: "Eres mi amooooor, mi kiki." },
            // FOTO 5
            { media: "foto-5.jpg", text: "Admiro lo inteligente, linda, dedicada que eres, gracias por estar en mi vida." },
            // FOTO 6
            { media: "foto-6.jpg", text: "Contigo no solo me brillan los ojos, me brilla la vida entera." },
            // GIF 4
            { media: "https://i.pinimg.com/originals/a1/da/1f/a1da1f6d81be542a1630fe46fcf7afbd.gif", text: "Un abrazo tuyo es el único lugar donde siempre quiero quedarme." },
            // FOTO 7
            { media: "foto-7.JPG", text: "La mejor parte de mi día siempre será esa en la que estoy contigo." },
            // FOTO 8
            { media: "foto-8.jpg", text: "Mi hermosa kiki, te amo, amo tu belleza, amo la forma que me quieres, amo como me haces reír, amo como la pasamos jutnos, amo tus besos, amo tus ojos, amo tu sonrisa simplemente te amoooo" },
            // GIF 5
            { media: "https://i.pinimg.com/originals/b1/42/2f/b1422fb9dfe6d682ed2ca0d41c015f62.gif", text: "Me hablaste de las cosas que te gustan, y ahora pienso en ti cada que las veo." },
            // FOTO 9
            { media: "foto-9.jpg", text: "No sé mucho sobre el futuro, pero me encanta imaginar cada día a tu lado." },
            // FOTO 10
            { media: "foto-10.jpg", text: "Amo tu forma de ser, me enamore desde que te conocí, me vuelves loco y te amoooo hoy y siempre." },
            // GIF 6
            { media: "https://i.pinimg.com/originals/7f/a6/dc/7fa6dc089760e85809d63cdcd4e885e4.gif", text: "Tanto tiempo, tantas personas, y pensar que todo este tiempo yo solo te buscaba a ti." },
            // FOTO 11
            { media: "foto-11.jpg", text: "Si supieras cómo me siento contigo, tu me complementas, te amo de todas las maneras, me siento tan pleno de ser tuyo, me gusta que nos amemos mucho, te amo karen, te amo mucho, te amaria de cualquier forma, en cualquier mundo, con cualquier pasado." },
            // GIF 7
            { media: "https://i.pinimg.com/originals/25/c1/9d/25c19dc85d7545f1ef5135de05c462bc.gif", text: "Felices 2 meses, mi kiki hermosa. Y que sean muchísimos más. ❤️ Tu J." }
        ];

        let currentIndex = 0;
        const mediaElement = document.getElementById('mainMedia');
        const messageElement = document.getElementById('messageText');

        function nextMemory() {
            currentIndex = (currentIndex + 1) % memories.length;
            
            mediaElement.style.opacity = '0';
            messageElement.style.opacity = '0';
            mediaElement.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                mediaElement.src = memories[currentIndex].media;
                messageElement.textContent = memories[currentIndex].text;
                
                mediaElement.style.opacity = '1';
                messageElement.style.opacity = '1';
                mediaElement.style.transform = 'scale(1)';
            }, 400);
        }

        // --- 2. CONTADOR DE TIEMPO DESDE EL 11 DE JUNIO ---
        const startDate = new Date('2026-06-11T00:00:00').getTime();

        function updateCounter() {
            const now = new Date().getTime();
            const difference = now - startDate;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('timeCounter').innerHTML = 
                `${days} días, ${hours} hrs, ${minutes} min y ${seconds} seg <br> amándote.`;
        }

        setInterval(updateCounter, 1000);
        updateCounter();

        // --- 3. MENSAJE SORPRESA A LOS 11 SEGUNDOS ---
        setTimeout(() => {
            const surpriseBox = document.getElementById('surpriseBox');
            surpriseBox.classList.add('show');
            
            setTimeout(() => {
                surpriseBox.classList.remove('show');
            }, 4000);
        }, 7000);

        // --- 4. RASTRO MÁGICO AL MOVER EL DEDO/MOUSE ---
        const trailContainer = document.getElementById('trail-container');
        
        function createTrail(x, y) {
            const particle = document.createElement('div');
            particle.className = 'trail-particle';
            
            particle.innerHTML = Math.random() > 0.5 ? '✨' : '💕';
            
            particle.style.left = (x - 10) + 'px';
            particle.style.top = (y - 10) + 'px';
            particle.style.fontSize = (Math.random() * 10 + 10) + 'px';
            
            trailContainer.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }

        document.addEventListener('mousemove', (e) => {
            if(Math.random() > 0.6) createTrail(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', (e) => {
            if(Math.random() > 0.4) {
                const touch = e.touches[0];
                createTrail(touch.clientX, touch.clientY);
            }
        });

        // --- 5. CORAZONES DE FONDO ---
        function createHearts() {
            const container = document.getElementById('hearts');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💜';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (Math.random() * 10 + 10) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        // --- 6. MÚSICA ---
        let isPlaying = false;
        const audioElement = document.getElementById('backgroundMusic');
        const musicBtn = document.getElementById('musicBtn');

        function toggleMusic() {
            if (!isPlaying) {
                audioElement.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerHTML = '🔊';
                    musicBtn.classList.add('playing');
                });
            } else {
                audioElement.pause();
                isPlaying = false;
                musicBtn.innerHTML = '🎵';
                musicBtn.classList.remove('playing');
            }
        }

        document.addEventListener('click', function initAudio() {
            if (!isPlaying) {
                audioElement.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerHTML = '🔊';
                    musicBtn.classList.add('playing');
                }).catch(e => {});
            }
            document.removeEventListener('click', initAudio);
        }, { once: true });

    </script>
</body>
</html>
